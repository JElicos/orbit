<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ORBIT</title>
<!-- 아이폰 홈 화면에 추가했을 때 주소창 없이 전체 화면으로 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORBIT">
<meta name="theme-color" content="#03050d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>
  // 아이폰 홈 화면 앱으로 실행 중이면 전용 배치를 적용
  if (window.navigator.standalone) document.documentElement.className = 'ios-app';
  // 웹 주소로 열렸을 때만 설치 정보를 연결(파일 더블클릭 실행에서는 건너뜀)
  if (location.protocol !== 'file:') {
    var m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest';
    document.head.appendChild(m);
  }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #03050d; overflow: hidden; }
  body {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 게임 화면은 노치 영역까지 꽉 채우고, 글자와 버튼만 안쪽으로 피합니다(game.js의 SAFE). */
  #game { position: fixed; left: 0; top: 0; right: 0; bottom: 0; }

  /* 아이폰 홈 화면 앱: 페이지 높이가 상태 표시줄만큼 짧게 잡혀 아래가 비는 문제가 있어,
     페이지 자체를 그만큼 늘리고 잘라내기를 풀어 맨 아래까지 그려지게 합니다. */
  html.ios-app { height: 100%; min-height: calc(100% + env(safe-area-inset-top, 0px)); overflow: visible; }
  html.ios-app body {
    position: static; height: 100%; min-height: calc(100% + env(safe-area-inset-top, 0px)); overflow: visible;
  }
  html.ios-app #game { position: absolute; right: auto; bottom: auto; width: 100%; }
  /* 상태 표시줄 바로 아래는 흐리게 처리되므로 MENU 버튼을 조금 더 내림 */
  html.ios-app #menuBtn { top: calc(2.2em + env(safe-area-inset-top, 0px)); }
  canvas { display: block; touch-action: none; }

  /* 메뉴는 게임 화면 위에 겹쳐지고, 글자 크기는 화면 크기에 맞춰 조정됩니다(ui.js). */
  #ui {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden;
    pointer-events: none; font-size: 16px; color: #e8f0ff; user-select: none;
    font-family: Bahnschrift, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #ui button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  #ui [hidden] { display: none !important; }

  #menuBtn {
    pointer-events: auto; position: absolute; right: .8em; top: calc(.7em + env(safe-area-inset-top, 0px));
    font-size: .95em; font-weight: 700; letter-spacing: .12em;
    padding: .35em .8em; border: 1px solid rgba(143,163,200,.5); border-radius: 2em;
    color: #8fa3c8; background: rgba(7,11,26,.6);
  }
  #menuBtn:hover { color: #fff; border-color: #fff; }

  #panel {
    pointer-events: auto; position: absolute; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column;
    padding: calc(1.2em + env(safe-area-inset-top, 0px)) 1.4em calc(1.6em + env(safe-area-inset-bottom, 0px));
    background: rgba(5,8,20,.94);
  }
  .panel-head { display: flex; align-items: stretch; gap: .5em; border-bottom: 1px solid rgba(143,163,200,.3); }
  .tabs { display: flex; flex: 1; min-width: 0; }
  .tab {
    flex: 1 1 auto; padding: .9em .3em .8em; font-size: .95em; font-weight: 700; letter-spacing: .08em;
    color: #8fa3c8; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  #ui .tab { color: #8fa3c8; border-bottom: 3px solid transparent; }
  #ui .tab:hover { color: #fff; }
  #ui .tab.active { color: #fff; border-bottom-color: #4cc9f0; }
  #ui #closeBtn { font-size: 1.8em; line-height: 1; padding: 0 .3em; color: #8fa3c8; }
  #ui #closeBtn:hover { color: #fff; }

  #tabBody { flex: 1; min-height: 0; overflow-y: auto; padding-top: 1.6em; }
  #tabBody h2 { margin: 0 0 1em; font-size: .9em; letter-spacing: .16em; color: #8fa3c8; font-weight: 700; }
  .note { color: #8fa3c8; font-size: .95em; line-height: 1.5; }

  /* SETTINGS */
  .vol { display: flex; align-items: flex-end; justify-content: center; gap: 1.6em; margin-top: 2em; }
  #ui .step {
    width: 2.6em; height: 2.6em; font-size: 1.5em; font-weight: 700; border-radius: 50%;
    border: 2px solid #4cc9f0; color: #4cc9f0;
  }
  #ui .step:hover:not(:disabled) { background: #4cc9f0; color: #070b1a; }
  #ui .step:disabled { opacity: .3; cursor: default; }
  .vbars { display: flex; align-items: flex-end; gap: .5em; height: 2.6em; padding-bottom: .65em; }
  .vbar { width: 1em; border-radius: .2em; background: rgba(143,163,200,.25); }
  .vbar.on { background: #4cc9f0; }
  .note.ver { margin-top: 3em; font-size: .8em; letter-spacing: .14em; opacity: .7; }
  .vol-label { text-align: center; font-size: 1.5em; font-weight: 700; margin: 1em 0 2.5em; }

  /* RECORDS */
  .bests { display: flex; gap: 1em; margin-bottom: 1em; }
  .bests.wide { margin-bottom: 2em; }
  .bests.wide b { display: inline-block; }
  .bests em { font-style: normal; margin-left: .8em; color: #8fa3c8; letter-spacing: .1em; }
  .bests > div { flex: 1; padding: 1em; border: 1px solid rgba(143,163,200,.3); border-radius: .6em; }
  .bests span { display: block; font-size: .8em; letter-spacing: .14em; color: #8fa3c8; }
  .bests b { display: block; font-size: 2.2em; margin-top: .15em; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: .75em; letter-spacing: .12em; color: #8fa3c8; font-weight: 700; text-align: right; padding: 0 .5em .7em; }
  td { text-align: right; padding: .62em .5em; border-top: 1px solid rgba(143,163,200,.16); font-size: 1.05em; }
  th:first-child, td:first-child { text-align: left; color: #8fa3c8; }
  td.num { font-weight: 700; color: #fff; }
  td.dim { color: #8fa3c8; font-size: .9em; }

  /* ACHIEVEMENTS */
  .ach { padding: 1em 0 1.15em; border-top: 1px solid rgba(143,163,200,.16); }
  .ach:first-child { border-top: 0; padding-top: 0; }
  .ach-top { display: flex; align-items: center; gap: .6em; }
  .dot { width: .8em; height: .8em; border-radius: 50%; background: var(--c); }
  .ach-name { flex: 1; font-weight: 700; letter-spacing: .08em; }
  .ach-lv { font-weight: 700; color: var(--c); }
  .segs { display: flex; gap: .3em; margin: .7em 0 .5em; }
  .seg { flex: 1; height: .7em; border-radius: .15em; background: rgba(143,163,200,.2); }
  .seg.on { background: var(--c); }
  .ach-sub { font-size: .9em; color: #8fa3c8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
  <button id="menuBtn" type="button" tabindex="-1">MENU</button>
  <div id="panel" hidden>
    <div class="panel-head">
      <div class="tabs">
        <button type="button" class="tab" data-tab="settings" tabindex="-1">SETTINGS</button>
        <button type="button" class="tab" data-tab="records" tabindex="-1">RECORDS</button>
        <button type="button" class="tab" data-tab="achievements" tabindex="-1">ACHIEVEMENTS</button>
      </div>
      <button id="closeBtn" type="button" tabindex="-1" aria-label="Close">&times;</button>
    </div>
    <div id="tabBody"></div>
  </div>
</div>
<script src="phaser.min.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script>
  // 오프라인 실행 준비(https 주소 또는 localhost에서만 동작)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
